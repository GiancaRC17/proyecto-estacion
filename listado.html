<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <title>Historial de Ventas</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            </head>
            <body class="bg-light">
            <div class="container mt-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2>Historial de Ventas</h2>
                                <a th:href="@{/ventas/nueva}" class="btn btn-primary">Registrar Nueva Venta</a>
                                    </div>

                                        <table class="table table-striped table-hover shadow-sm bg-white rounded">
                                                <thead class="table-dark">
                                                            <tr>
                                                                            <th>ID</th>
                                                                                            <th>Combustible</th>
                                                                                                            <th>Galones</th>
                                                                                                                            <th>Monto Total</th>
                                                                                                                                            <th>Medio Pago</th>
                                                                                                                                                            <th>Fecha</th>
                                                                                                                                                                            <th>Acciones</th>
                                                                                                                                                                                        </tr>
                                                                                                                                                                                                </thead>
                                                                                                                                                                                                        <tbody>
                                                                                                                                                                                                                    <tr th:each="v : ${ventas}">
                                                                                                                                                                                                                                    <td th:text="${v.id}">1</td>
                                                                                                                                                                                                                                                    <td th:text="${v.tipoCombustible}">Regular</td>
                                                                                                                                                                                                                                                                    <td th:text="${v.galones}">5.0</td>
                                                                                                                                                                                                                                                                                    <td th:text="${'S/ ' + v.precioTotal}">S/ 90.00</td>
                                                                                                                                                                                                                                                                                                    <td><span class="badge bg-info text-dark" th:text="${v.medioPago}">Yape</span></td>
                                                                                                                                                                                                                                                                                                                    <td th:text="${v.fecha}">2026-08-20</td>
                                                                                                                                                                                                                                                                                                                                    <td>
                                                                                                                                                                                                                                                                                                                                                        <a th:href="@{/ventas/editar/{id}(id=${v.id})}" class="btn btn-warning btn-sm">Editar</a>
                                                                                                                                                                                                                                                                                                                                                                            <a th:href="@{/ventas/eliminar/{id}(id=${v.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desea eliminar la venta?')">Eliminar</a>
                                                                                                                                                                                                                                                                                                                                                                                            </td>
                                                                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                </tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                    </table>
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
