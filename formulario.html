<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <title>Formulario de Venta</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            </head>
            <body class="bg-light">
            <div class="container mt-5" style="max-width: 600px;">
                <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                                    <h4 th:text="${venta.id == null ? 'Registrar Venta' : 'Editar Venta'}"></h4>
                                            </div>
                                                    <div class="card-body">
                                                                <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
                                                                                <input type="hidden" th:field="*{id}"/>

                                                                                                <div class="mb-3">
                                                                                                                    <label class="form-label">Tipo de Combustible</label>
                                                                                                                                        <select class="form-select" th:field="*{tipoCombustible}" required>
                                                                                                                                                                <option value="Regular">Gasohol Regular</option>
                                                                                                                                                                                        <option value="Premium">Gasohol Premium</option>
                                                                                                                                                                                                                <option value="Diesel">Diésel DB5</option>
                                                                                                                                                                                                                                    </select>
                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                    <div class="mb-3">
                                                                                                                                                                                                                                                                                        <label class="form-label">Galones</label>
                                                                                                                                                                                                                                                                                                            <input type="number" step="0.01" class="form-control" th:field="*{galones}" required/>
                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                            <div class="mb-3">
                                                                                                                                                                                                                                                                                                                                                                <label class="form-label">Precio Total (S/)</label>
                                                                                                                                                                                                                                                                                                                                                                                    <input type="number" step="0.01" class="form-control" th:field="*{precioTotal}" required/>
                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="mb-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <label class="form-label">Costo Total (S/)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="number" step="0.01" class="form-control" th:field="*{costoTotal}" required/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="mb-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label class="form-label">Medio de Pago</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select class="form-select" th:field="*{medioPago}" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="Efectivo">Efectivo</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="Yape/Plin">Yape / Plin</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="Tarjeta">Tarjeta</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="mb-3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label class="form-label">Fecha</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="date" class="form-control" th:field="*{fecha}" required/>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a th:href="@{/ventas}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
