<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
        <title>Margen de Ganancia</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            </head>
            <body class="bg-light">
            <div class="container mt-4">
                <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                                    <h3>Margen de Ganancia por Combustible (Mensual)</h3>
                                            </div>
                                                    <div class="card-body">
                                                                <table class="table table-bordered table-striped">
                                                                                <thead class="table-primary">
                                                                                                    <tr>
                                                                                                                            <th>Mes</th>
                                                                                                                                                    <th>Combustible</th>
                                                                                                                                                                            <th>Ganancia Total (S/)</th>
                                                                                                                                                                                                </tr>
                                                                                                                                                                                                                </thead>
                                                                                                                                                                                                                                <tbody>
                                                                                                                                                                                                                                                    <tr th:each="m : ${metricas}">
                                                                                                                                                                                                                                                                            <td th:text="${m[0]}">Enero</td>
                                                                                                                                                                                                                                                                                                    <td th:text="${m[1]}">Regular</td>
                                                                                                                                                                                                                                                                                                                            <td th:text="${'S/ ' + #numbers.formatDecimal(m[2], 1, 2)}">S/ 1500.00</td>
                                                                                                                                                                                                                                                                                                                                                </tr>
                                                                                                                                                                                                                                                                                                                                                                </tbody>
                                                                                                                                                                                                                                                                                                                                                                            </table>
                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                        </html>
